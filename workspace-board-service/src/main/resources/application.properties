server.port=8082
spring.application.name=workspace-board-service

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/flowboard_workspace?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT — same secret as auth-service to validate tokens
app.jwt.secret=flowboard_super_secret_key_change_in_production_min_256_bits
app.jwt.expiry-ms=86400000

# Auth service URL — for inter-service calls
auth.service.url=http://localhost:8081

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html