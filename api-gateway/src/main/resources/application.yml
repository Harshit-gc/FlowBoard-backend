server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600

      routes:

        # ── AUTH SERVICE (8081) ──────────────────────────────────────────────

        # Public endpoints — no JWT required
        - id: auth-public
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/register,/api/v1/auth/login,/api/v1/auth/refresh,/api/v1/auth/validate
          order: 1

        # Admin endpoints — JWT + PLATFORM_ADMIN role required
        - id: auth-admin
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/admin/**
          filters:
            - name: AuthFilter
              args:
                requiredRole: PLATFORM_ADMIN
          order: 2

        # All other auth endpoints — JWT required
        - id: auth-protected
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - AuthFilter
          order: 3

        # ── WORKSPACE-BOARD SERVICE (8082) ───────────────────────────────────

        # Public board view — no JWT required (guest access from PDF)
        - id: public-boards
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/boards/{boardId}
            - Method=GET
          order: 4

        # All workspace and board endpoints — JWT required
        - id: workspace-board
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/workspaces/**,/api/v1/boards/**
          filters:
            - AuthFilter
          order: 5

        # ── TASK SERVICE (8083) ──────────────────────────────────────────────

        - id: task
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/lists/**,/api/v1/cards/**
          filters:
            - AuthFilter
          order: 6

        # ── COLLABORATION SERVICE (8084) ─────────────────────────────────────

        - id: collaboration
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/comments/**,/api/v1/attachments/**,/api/v1/labels/**,/api/v1/checklists/**,/api/v1/checklist-items/**
          filters:
            - AuthFilter
          order: 7

        # ── NOTIFICATION SERVICE (8085) ──────────────────────────────────────

        - id: notification
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - AuthFilter
          order: 8

# ── JWT secret — must match all 5 services exactly ───────────────────────────
app:
  jwt:
    secret: flowboard_super_secret_key_change_in_production_min_256_bits

# ── Actuator ─────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.flowboard.gateway: DEBUG